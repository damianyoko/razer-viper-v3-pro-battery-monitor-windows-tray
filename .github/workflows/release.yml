name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binary
        working-directory: rust
        run: cargo build --release

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stage = "release-bundle"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item rust/target/release/razer-viper-tray.exe $stage/
          Copy-Item install.ps1 $stage/
          Copy-Item uninstall.ps1 $stage/
          Copy-Item README.md $stage/
          Copy-Item LICENSE $stage/
          Copy-Item CHANGELOG.md $stage/
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "$stage/*" -DestinationPath "razer-viper-tray-$tag.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            razer-viper-tray-*.zip
            rust/target/release/razer-viper-tray.exe
          generate_release_notes: false
          body_path: CHANGELOG.md
